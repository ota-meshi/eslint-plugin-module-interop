name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install Dependencies
        run: npm install

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v2.1.1
        with:
          # this expects you to have a npm script called version that runs some logic and then calls `changeset version`.
          version-script: npm run version:ci
          # This expects you to have a script called release which does a build for your packages and calls changeset publish
          publish-script: npm run release
          commit-message: "chore: release eslint-plugin-module-interop"
          pr-title: "chore: release eslint-plugin-module-interop"
